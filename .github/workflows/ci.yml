# PR gate: {lt=LTS 1.0.5, st=STS 1.2.0} on Linux.
# Windows temporarily REMOVED (2026-10-28): two documented Cangjie
# windows-x64 toolchain defects make the cells structurally red -
# cjc -O2 miscompilation (lz4fSkippableTest, report/windows_test_findings.md)
# and a non-deterministic runtime livelock (hangs the suite ~every other
# full run; rerun passes). Re-add 'windows-latest' to the os matrix once a
# fixed toolchain ships, together with: choco mingw step (kept below),
# -O0 downgrade for the lt cell, and timeout+retry around cjpm test.
# macOS (macos-15/arm64 + mac-aarch64 SDK) is a planned follow-up.
name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.tc }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        tc: [lt, st]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # lt -> lts (1.0.5), st -> sts (1.2.0); mirrors download_sdk.sh's table
      CHANNEL: ${{ matrix.tc == 'lt' && 'lts' || 'sts' }}
    steps:
      - uses: actions/checkout@v4

      # scripts committed from Windows lack the exec bit (core.filemode=false
      # there); Linux runners refuse to exec them. Harmless no-op on Windows.
      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh e2e/*.sh

      - name: C toolchain (Windows)
        if: runner.os == 'Windows'
        run: command -v gcc >/dev/null 2>&1 || choco install mingw -y --no-progress

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/cangjie-lts-*
            ~/.local/cangjie-sts-*
          # invalidate on SDK bump: <version>-<sha256 first 8> from download_sdk.sh
          key: cangjie-${{ runner.os }}-${{ matrix.tc }}-${{ matrix.tc == 'lt' && '1.0.5-bacada84' || '1.2.0-8c5fd944' }}

      - name: Install Cangjie SDK (${{ env.CHANNEL }})
        run: scripts/download_sdk.sh "$CHANNEL"

      - name: Regenerate golden corpus (upstream 0774d055)
        run: |
          git clone https://github.com/lz4/lz4 ~/lz4
          git -C ~/lz4 checkout 0774d055
          scripts/gen_golden.sh

      - name: Build + unit/golden tests (${{ matrix.tc }})
        run: scripts/build_and_test.sh ${{ matrix.tc }} test-only

      - name: Downstream dependency smoke (${{ matrix.tc }})
        run: scripts/verify_downstream.sh ${{ matrix.tc }}

      - name: e2e cross-validation vs upstream C (${{ matrix.tc }})
        run: e2e/run_e2e.sh ${{ matrix.tc }}

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.tc }}-${{ runner.os }}
          path: |
            report/
            e2e/tmp/
          if-no-files-found: ignore
          retention-days: 14
