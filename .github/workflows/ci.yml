# PR gate: {lt=LTS 1.0.5, st=STS 1.2.0} on Linux + macOS (arm64).
# macOS label is PINNED to macos-15: macos-latest (macOS 26 / Xcode 26.x
# images) ships a libSystem.tbd that the Cangjie SDK's bundled ld64.lld
# rejects ("incompatible with arm64" -> undefined libc symbols at link);
# macos-15 builds and runs the full suite. Re-evaluate on SDK updates.
# Windows temporarily REMOVED (2026-10-28): two documented Cangjie
# windows-x64 toolchain defects make the cells structurally red -
# cjc -O2 miscompilation (lz4fSkippableTest, report/windows_test_findings.md)
# and a non-deterministic runtime livelock (hangs the suite ~every other
# full run; rerun passes). Re-add 'windows-latest' to the os matrix once a
# fixed toolchain ships, together with: choco mingw step (kept below),
# -O0 downgrade for the lt cell, and timeout+retry around cjpm test.
name: test

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.tc }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        tc: [lt, st]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # lt -> lts (1.0.5), st -> sts (1.2.0); mirrors download_sdk.sh's table
      CHANNEL: ${{ matrix.tc == 'lt' && 'lts' || 'sts' }}
    steps:
      - uses: actions/checkout@v4

      # scripts committed from Windows lack the exec bit (core.filemode=false
      # there); Linux runners refuse to exec them. Harmless no-op on Windows.
      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh e2e/*.sh

      - name: C toolchain (Windows)
        if: runner.os == 'Windows'
        run: command -v gcc >/dev/null 2>&1 || choco install mingw -y --no-progress

      # GNU timeout is missing on stock macOS; run_e2e.sh falls back to
      # gtimeout (brew coreutils) or runs unguarded - ensure coreutils.
      - name: GNU coreutils (macOS)
        if: runner.os == 'macOS'
        run: command -v gtimeout >/dev/null 2>&1 || brew install coreutils

      - name: Cache Cangjie SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/cangjie-lts-*
            ~/.local/cangjie-sts-*
          # invalidate on SDK bump: <version>-<sha256 first 8> from download_sdk.sh
          key: cangjie-${{ runner.os }}-${{ matrix.tc }}-${{ matrix.tc == 'lt' && '1.0.5-bacada84' || '1.2.0-8c5fd944' }}

      - name: Install Cangjie SDK (${{ env.CHANNEL }})
        run: scripts/download_sdk.sh "$CHANNEL"

      - name: Regenerate golden corpus (upstream 0774d055)
        run: |
          git clone https://github.com/lz4/lz4 ~/lz4
          git -C ~/lz4 checkout 0774d055
          scripts/gen_golden.sh

      - name: Build + unit/golden tests (${{ matrix.tc }})
        run: scripts/build_and_test.sh ${{ matrix.tc }} test-only

      # Distill failure causes into annotations: ::error:: lines are
      # readable via the public check-run annotations API, unlike raw job
      # logs (which need sign-in), so red cells can be diagnosed remotely.
      # Grep failing case names / exceptions first (they sit earlier in
      # the log than the summary), then the tail as fallback.
      - name: Failure diagnostics
        if: failure()
        run: |
          ESC=$(printf '\033')
          for f in report/*.log; do
            [ -f "$f" ] || continue
            clean=$(mktemp)
            sed -e "s/${ESC}\[[0-9;?]*[A-Za-z]//g" "$f" > "$clean"
            grep -B15 -A2 "FAILED.*CASE\|FAILED:" "$clean" | head -60 \
              | sed "s|^|::error::[$(basename "$f")] |" || true
            rm -f "$clean"
          done

      # Rerun just the failing case and surface its full output (assert
      # locations, expected/actual) as annotations.
      - name: Failure detail (rerun failing case)
        if: failure()
        run: |
          VER=$([ "${{ matrix.tc }}" = lt ] && echo 1.0.5 || echo 1.2.0)
          CASE=$(grep -aho "FAILED.*CASE: [A-Za-z0-9_]*" report/*.log 2>/dev/null \
            | head -1 | sed 's/.*CASE: //')
          if [ -n "$CASE" ]; then
            . scripts/cjenv.sh
            S="$(cjenv_setup "$VER")" || true
            if [ -n "${S:-}" ]; then
              bash -c "source '$S' && cjpm test --no-color --filter $CASE" 2>&1 | tail -60 \
                | sed "s|^|::error::[rerun $CASE] |" || true
            fi
          fi
          # corpus fingerprint: is the regenerated corpus itself different
          # on this platform? (win/linux manifest md5: df43d7b826ec...)
          if [ -f corpus/block_golden_ref.txt ]; then
            MD5=$(md5sum corpus/block_golden_ref.txt 2>/dev/null | cut -d' ' -f1 \
              || md5 -q corpus/block_golden_ref.txt)
            echo "::error::[corpus] manifest md5=$MD5 (win/linux: df43d7b826ec53347ee7d0e9cb97fa52)"
            echo "::error::[corpus] artifacts=$(ls corpus/block 2>/dev/null | wc -l | tr -d ' ') bytes=$(cat corpus/block/*.lz4 2>/dev/null | wc -c | tr -d ' ')"
          fi

      - name: Downstream dependency smoke (${{ matrix.tc }})
        run: scripts/verify_downstream.sh ${{ matrix.tc }}

      - name: e2e cross-validation vs upstream C (${{ matrix.tc }})
        run: e2e/run_e2e.sh ${{ matrix.tc }}

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.tc }}-${{ runner.os }}
          path: |
            report/
            e2e/tmp/
          if-no-files-found: ignore
          retention-days: 14
